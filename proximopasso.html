<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Girl</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #030108;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(18, 8, 30, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(218, 179, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(147, 51, 234, 0.3),
                        inset 0 0 15px rgba(218, 179, 255, 0.15);
        }

        /* Caixa de Texto customizada para as frases finais */
        .text-box-custom {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(218, 179, 255, 0.25);
            border-radius: 10px;
            padding: 16px 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(218, 179, 255, 0.1);
        }

        .neon-btn {
            background: linear-gradient(135deg, rgba(218, 179, 255, 0.25) 0%, rgba(168, 85, 247, 0.45) 100%);
            border: 1px solid rgba(218, 179, 255, 0.7);
            color: #f3e8ff;
            text-shadow: 0 0 10px rgba(218, 179, 255, 0.8), 0 0 20px rgba(168, 85, 247, 0.6);
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.3), inset 0 0 10px rgba(218, 179, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .neon-btn:hover {
            transform: translateY(-2px) scale(1.02);
            background: linear-gradient(135deg, rgba(218, 179, 255, 0.4) 0%, rgba(168, 85, 247, 0.7) 100%);
            box-shadow: 0 0 30px rgba(218, 179, 255, 0.7), 0 0 50px rgba(168, 85, 247, 0.5);
            border-color: rgba(233, 213, 255, 1);
        }

        /* Float Animation */
        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .floating-box {
            animation: floatUpDown 3s ease-in-out infinite;
        }

        /* Equalizer Bars */
        .eq-bar {
            width: 3px;
            background-color: #dab3ff;
            border-radius: 3px;
            animation: eq 1s ease-in-out infinite alternate;
        }
        .eq-bar:nth-child(1) { height: 10px; animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { height: 18px; animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { height: 14px; animation-delay: 0.2s; }
        
        @keyframes eq {
            0% { height: 4px; }
            100% { height: 18px; }
        }
        .paused .eq-bar {
            animation-play-state: paused;
            height: 4px !important;
        }
    </style>
</head>
<body class="relative min-h-screen flex flex-col justify-between items-center overflow-y-auto">

    <!-- Canvas Animation Layer -->
    <canvas id="neonCanvas"></canvas>

    <!-- UI Overlay -->
    <div class="relative z-10 flex flex-col items-center justify-between w-full max-w-4xl min-h-screen p-6 pointer-events-none">
        
        <!-- HEADER: Botão de Música no Topo -->
        <header class="w-full flex justify-center pointer-events-auto pt-2">
            <button id="playBtn" class="neon-btn px-6 py-3 rounded-full flex items-center gap-3 text-sm md:text-base font-bold tracking-wide">
                <div id="eqIcon" class="flex items-end gap-1 h-5 paused">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                </div>
                <span>Favorite Girl - Justin Bieber 🎵</span>
                <i id="playIcon" class="fa-solid fa-play ml-1 text-xs"></i>
            </button>
        </header>

        <!-- CENTER: Caixa Flutuante Spotify -->
        <main class="w-full max-w-md my-auto pointer-events-auto px-4">
            <div class="glass-panel p-4 rounded-3xl shadow-2xl border border-purple-500/40 flex flex-col items-center gap-3">
                <div class="w-full flex items-center justify-between px-2">
                    <span class="text-xs font-semibold tracking-wider text-purple-200 uppercase flex items-center gap-2">
                        <i class="fa-brands fa-spotify text-green-400 text-sm"></i> Memórias Póstumas de um amor resiliente
                    </span>
                    <span class="w-2 h-2 rounded-full bg-purple-400 animate-pulse"></span>
                </div>
                
                <!-- Novo Iframe da Playlist do Spotify -->
                <div class="w-full rounded-2xl overflow-hidden shadow-lg bg-black/50">
                    <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/0oYDW53WkRFJH20x4Oules?utm_source=generator&theme=0&si=dc90ce816b3e44f7" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                </div>
            </div>
        </main>

        <!-- FOOTER: Frases com Caixa Translúcida e Botão para lastpart.html -->
        <footer class="w-full flex flex-col items-center gap-5 pb-6 pointer-events-auto text-center">
            
            <!-- Caixa de Texto com bordas de 10px, fundo translúcido preto e fonte 24px -->
            <div class="floating-box text-box-custom flex flex-col gap-2">
                <p class="text-[20px] md:text-[24px] font-semibold text-purple-100 drop-shadow-[0_0_12px_rgba(218,179,255,0.7)] leading-tight">
                    Obrigada por me acompanhar até aqui! 💜
                </p>
                <p class="text-[16px] md:text-[20px] font-medium text-purple-300/90">
                    Pronta para a última parte?
                </p>
            </div>

            <!-- Botão Roxo Neon com link para lastpart.html -->
            <a href="lastpart.html" class="neon-btn bg-purple-600/90 hover:bg-purple-600 text-white font-bold px-9 py-3.5 rounded-full text-base md:text-lg tracking-wider uppercase shadow-[0_0_25px_rgba(168,85,247,0.7)] inline-block text-center">
                Bora fia ✨
            </a>

            <span class="text-[10px] text-purple-300/40 mt-1">
                Renderizado via HTML5 Canvas • by Anellize 💜 2026
            </span>
        </footer>
    </div>

    <!-- AUDIO ELEMENT -->
    <audio id="bgMusic" loop preload="auto">
        <source src="FavoriteGirl.Justin Bieber.mp3" type="audio/mpeg">
        <source src="FavoriteGirl.Justin Bieber.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('neonCanvas');
        const ctx = canvas.getContext('2d');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const eqIcon = document.getElementById('eqIcon');
        const bgMusic = document.getElementById('bgMusic');

        let width, height;
        let particles = [];
        let isPlaying = false;
        let frame = 0;

        const CONFIG = {
            text: "favorite girl",
            font: "bold 9px Arial, sans-serif",
            baseColor: { r: 218, g: 179, b: 255 }
        };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            loadAndProcessImage();
        }

        class Particle {
            constructor(x, y, opacityMult = 1.0) {
                this.x = x;
                this.y = y;
                this.opacityMult = opacityMult;
                this.flickerSpeed = 0.03 + Math.random() * 0.05;
                this.flickerOffset = Math.random() * Math.PI * 2;
                this.floatOffset = Math.random() * Math.PI * 2;
                this.floatSpeed = 0.01 + Math.random() * 0.015;
            }

            draw(ctx, frame) {
                let alpha = (160 + 85 * Math.sin(frame * this.flickerSpeed + this.flickerOffset)) / 255;
                alpha = Math.max(0.2, Math.min(1.0, alpha)) * this.opacityMult;

                const dx = Math.cos(frame * this.floatSpeed + this.floatOffset) * 0.5;
                const dy = Math.sin(frame * this.floatSpeed + this.floatOffset) * 0.5;

                ctx.save();
                ctx.font = CONFIG.font;
                ctx.fillStyle = `rgba(${CONFIG.baseColor.r}, ${CONFIG.baseColor.g}, ${CONFIG.baseColor.b}, ${alpha})`;
                ctx.shadowColor = `rgba(218, 179, 255, ${alpha * 0.8})`;
                ctx.shadowBlur = 4;

                ctx.fillText(CONFIG.text, this.x + dx, this.y + dy);
                ctx.restore();
            }
        }

        function loadAndProcessImage() {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = 'fotok.jpeg';
            
            img.onload = function() {
                renderSideSilhouettes(img);
            };
            img.onerror = function() {
                console.warn("fotok.jpeg não foi encontrada localmente.");
            };
        }

        function renderSideSilhouettes(img) {
            particles = [];
            
            const offscreen = document.createElement('canvas');
            const offCtx = offscreen.getContext('2d');
            
            const processW = 600;
            const processH = Math.round(600 * (img.height / img.width));
            offscreen.width = processW;
            offscreen.height = processH;

            offCtx.drawImage(img, 0, 0, processW, processH);
            const imgData = offCtx.getImageData(0, 0, processW, processH);
            const data = imgData.data;

            const rawPoints = [];
            const step = 1; 
            
            for (let y = 0; y < processH; y += step) {
                for (let x = 0; x < processW; x += step) {
                    const idx = (y * processW + x) * 4;
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const brightness = (r + g + b) / 3;

                    if (brightness < 110) {
                        rawPoints.push({
                            normX: x / processW,
                            normY: y / processH
                        });
                    }
                }
            }

            const isMobile = width < 768;
            const scaleFactor = isMobile ? 0.6 : 0.75;
            const drawH = Math.min(height * scaleFactor, 620);
            const drawW = drawH * (processW / processH);

            const positions = [
                { posX: width * 0.18 - drawW / 2, opacity: 0.7 },
                { posX: width * 0.82 - drawW / 2, opacity: 0.7 }
            ];

            const posY = (height - drawH) / 2;

            positions.forEach(pos => {
                const sampled = rawPoints.sort(() => 0.5 - Math.random()).slice(0, isMobile ? 4000 : 7500);
                
                sampled.forEach(pt => {
                    const realX = pos.posX + (pt.normX * drawW);
                    const realY = posY + (pt.normY * drawH);
                    
                    particles.push(new Particle(realX, realY, pos.opacity));
                });
            });
        }

        function animate() {
            frame++;
            ctx.fillStyle = 'rgba(3, 1, 8, 0.35)';
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < particles.length; i++) {
                particles[i].draw(ctx, frame);
            }
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(animate);
        }

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    eqIcon.classList.remove('paused');
                    playIcon.className = 'fa-solid fa-pause ml-1 text-xs';
                }).catch(e => {
                    alert("Clique novamente para reproduzir a música!");
                });
            } else {
                bgMusic.pause();
                isPlaying = false;
                eqIcon.classList.add('paused');
                playIcon.className = 'fa-solid fa-play ml-1 text-xs';
            }
        });

        window.addEventListener('resize', resize);
        window.addEventListener('load', () => {
            resize();
            animate();
        });
    </script>
</body>
</html>
