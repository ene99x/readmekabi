<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Girl</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fira+Code:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030108;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(18, 8, 30, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(218, 179, 255, 0.35);
            box-shadow: 0 8px 32px 0 rgba(147, 51, 234, 0.35),
                        inset 0 0 15px rgba(218, 179, 255, 0.15);
        }

        /* Caixa de Texto customizada */
        .text-box-custom {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(218, 179, 255, 0.3);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(218, 179, 255, 0.15);
        }

        .neon-btn {
            background: linear-gradient(135deg, rgba(218, 179, 255, 0.25) 0%, rgba(168, 85, 247, 0.5) 100%);
            border: 1px solid rgba(218, 179, 255, 0.7);
            color: #f3e8ff;
            text-shadow: 0 0 10px rgba(218, 179, 255, 0.8), 0 0 20px rgba(168, 85, 247, 0.6);
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.3), inset 0 0 10px rgba(218, 179, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .neon-btn:hover {
            transform: translateY(-2px) scale(1.02);
            background: linear-gradient(135deg, rgba(218, 179, 255, 0.4) 0%, rgba(168, 85, 247, 0.75) 100%);
            box-shadow: 0 0 30px rgba(218, 179, 255, 0.7), 0 0 50px rgba(168, 85, 247, 0.5);
            border-color: rgba(233, 213, 255, 1);
        }

        /* Float Animation */
        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .floating-box {
            animation: floatUpDown 3s ease-in-out infinite;
        }

        /* Equalizer Bars */
        .eq-bar {
            width: 3px;
            background-color: #dab3ff;
            border-radius: 3px;
            animation: eq 1s ease-in-out infinite alternate;
        }
        .eq-bar:nth-child(1) { height: 10px; animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { height: 18px; animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { height: 14px; animation-delay: 0.2s; }
        
        @keyframes eq {
            0% { height: 4px; }
            100% { height: 18px; }
        }
        .paused .eq-bar {
            animation-play-state: paused;
            height: 4px !important;
        }
    </style>
</head>
<body class="relative h-screen w-screen flex flex-col justify-between items-center overflow-hidden">

    <!-- Canvas Animation Layer (Efeito Matrix Roxo) -->
    <canvas id="matrixCanvas"></canvas>

    <!-- UI Overlay -->
    <div class="relative z-10 flex flex-col items-center justify-between w-full max-w-4xl h-full py-4 px-4 pointer-events-none">
        
        <!-- HEADER: Botão de Música no Topo -->
        <header class="w-full flex justify-center pointer-events-auto shrink-0">
            <button id="playBtn" class="neon-btn px-5 py-2.5 rounded-full flex items-center gap-3 text-xs md:text-sm font-bold tracking-wide">
                <div id="eqIcon" class="flex items-end gap-1 h-4 paused">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                </div>
                <span>Favorite Girl - Justin Bieber 🎵</span>
                <i id="playIcon" class="fa-solid fa-play ml-1 text-xs"></i>
            </button>
        </header>

        <!-- CENTER: Caixa Flutuante Spotify Ajustada -->
        <main class="w-full max-w-md my-auto pointer-events-auto px-2 shrink">
            <div class="glass-panel p-3.5 rounded-3xl shadow-2xl border border-purple-500/40 flex flex-col items-center gap-2.5">
                <div class="w-full flex items-center justify-between px-2">
                    <span class="text-xs font-semibold tracking-wider text-purple-200 uppercase flex items-center gap-2 truncate">
                        <i class="fa-brands fa-spotify text-green-400 text-sm"></i> Memórias Póstumas de Um Amor
                    </span>
                    <span class="w-2 h-2 rounded-full bg-purple-400 animate-pulse shrink-0"></span>
                </div>
                
                <!-- Iframe da Playlist do Spotify com Altura Ideal para Cenas Curtas -->
                <div class="w-full rounded-2xl overflow-hidden shadow-lg bg-black/60">
                    <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/0oYDW53WkRFJH20x4Oules?utm_source=generator&theme=0&si=dc90ce816b3e44f7" width="100%" height="280" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                </div>
            </div>
        </main>

        <!-- FOOTER: Frases e Botão -->
        <footer class="w-full flex flex-col items-center gap-3 shrink-0 pointer-events-auto text-center pb-2">
            
            <!-- Caixa de Texto Translúcida -->
            <div class="floating-box text-box-custom px-6 py-3 flex flex-col gap-1 max-w-md">
                <p class="text-[17px] md:text-[21px] font-semibold text-purple-100 drop-shadow-[0_0_12px_rgba(218,179,255,0.7)] leading-tight">
                    Obrigada por me acompanhar até aqui! 💜
                </p>
                <p class="text-[14px] md:text-[17px] font-medium text-purple-300/90">
                    Pronta para a última parte?
                </p>
            </div>

            <!-- Botão Roxo Neon para lastpart.html -->
            <a href="lastpart.html" class="neon-btn bg-purple-600/90 hover:bg-purple-600 text-white font-bold px-8 py-3 rounded-full text-sm md:text-base tracking-wider uppercase shadow-[0_0_25px_rgba(168,85,247,0.7)] inline-block text-center">
                Bora fia ✨
            </a>

            <span class="text-[10px] text-purple-300/40">
                Renderizado via HTML5 Canvas • by Anellize 💜 2026
            </span>
        </footer>
    </div>

    <!-- AUDIO ELEMENT -->
    <audio id="bgMusic" loop preload="auto">
        <source src="FavoriteGirl.Justin Bieber.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const eqIcon = document.getElementById('eqIcon');
        const bgMusic = document.getElementById('bgMusic');

        let width, height;
        let columns = [];
        let isPlaying = false;

        const phrase = "MY FAVORITE GIRL ";
        const fontSize = 14;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initMatrix();
        }

        function initMatrix() {
            columns = [];
            const colWidth = fontSize + 4;
            const totalCols = Math.floor(width / colWidth);

            for (let i = 0; i < totalCols; i++) {
                const x = i * colWidth;
                
                // Filtra as colunas para desenhar APENAS nas laterais (esquerda e direita)
                const isLeft = x < width * 0.28;
                const isRight = x > width * 0.72;

                if (isLeft || isRight) {
                    columns.push({
                        x: x,
                        y: Math.random() * -height,
                        speed: 1.5 + Math.random() * 2.5,
                        charIndex: Math.floor(Math.random() * phrase.length)
                    });
                }
            }
        }

        function drawMatrix() {
            // Efeito de rastro roxo/preto transparente
            ctx.fillStyle = 'rgba(3, 1, 8, 0.18)';
            ctx.fillRect(0, 0, width, height);

            ctx.font = `700 ${fontSize}px 'Fira Code', monospace`;

            for (let i = 0; i < columns.length; i++) {
                const col = columns[i];
                const char = phrase[col.charIndex % phrase.length];

                // Letra da frente com brilho mais forte
                ctx.fillStyle = '#f3e8ff';
                ctx.shadowColor = '#d8b4e2';
                ctx.shadowBlur = 8;
                ctx.fillText(char, col.x, col.y);

                // Letras anteriores do rastro roxo neon
                ctx.fillStyle = 'rgba(168, 85, 247, 0.85)';
                ctx.shadowBlur = 0;
                ctx.fillText(phrase[(col.charIndex + phrase.length - 1) % phrase.length], col.x, col.y - fontSize);

                col.y += fontSize * 0.85 * (col.speed / 2);
                col.charIndex++;

                if (col.y > height && Math.random() > 0.95) {
                    col.y = 0;
                }
            }

            requestAnimationFrame(drawMatrix);
        }

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    eqIcon.classList.remove('paused');
                    playIcon.className = 'fa-solid fa-pause ml-1 text-xs';
                }).catch(() => {
                    alert("Clique novamente para reproduzir a música!");
                });
            } else {
                bgMusic.pause();
                isPlaying = false;
                eqIcon.classList.add('paused');
                playIcon.className = 'fa-solid fa-play ml-1 text-xs';
            }
        });

        window.addEventListener('resize', resize);
        window.addEventListener('load', () => {
            resize();
            drawMatrix();
        });
    </script>
</body>
</html>
